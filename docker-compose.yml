services:
  mongo:
    image: mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo:/data/db

  mumble:
    image: mumblevoip/mumble-server:v1.6.1001
    post_start:
      # Mumble 1.6 rejects the SuperUser password set by the image before its first startup.
      - command: >-
          bash -c 'until (exec 3<>/dev/tcp/127.0.0.1/64738) 2>/dev/null; do sleep 1; done;
          mumble-server --foreground --ini /data/mumble_server_config.ini --set-su-pw 123456 0'
        user: '10000:10000'
    ports:
      - 64738:64738/tcp
      - 64738:64738/udp
    profiles: [mumble]

  gameserver:
    image: ghcr.io/tf2pickup-org/tf2-gameserver:latest
    environment:
      - 'SERVER_HOSTNAME=test game server 1'
      - 'PORT=27015'
      - 'CLIENT_PORT=27016'
      - 'STEAM_PORT=27017'
      - 'STV_PORT=27020'
      - 'RCON_PASSWORD=123456'
      - 'TF2PICKUPORG_API_ADDRESS=127.0.0.1:3000'
      - 'TF2PICKUPORG_SECRET=xxxxxx'
    network_mode: host
    stdin_open: true
    tty: true
    profiles: [gameserver]

  umami:
    container_name: umami
    image: ghcr.io/umami-software/umami:postgresql-latest
    ports:
      - '3001:3000'
    environment:
      DATABASE_URL: postgresql://umami:umami123@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      HASH_SALT: replace-me-with-a-random-string
    depends_on:
      - umami-db
    restart: always
    profiles: [analytics]

  umami-db:
    container_name: umami-db
    image: postgres:19-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami123
    volumes:
      - umami-db:/var/lib/postgresql
    restart: always
    profiles: [analytics]

volumes:
  mongo:
  umami-db:
