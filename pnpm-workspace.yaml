overrides:
  '@fastify/busboy@3': '3.2.5'
  'ip-address@<10.7.4': '10.7.6'
  'js-yaml@4': '4.3.2'
  'minimatch@<11.0.1': '11.0.8'
  'picomatch@2': '2.3.2'
  'postcss-selector-parser@6': '6.1.6'
  'undici@6': '6.29.1'
  'vite@7': '7.3.8'
  fast-uri: '4.2.3'
  protobufjs: '8.8.1'

allowBuilds:
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@tf2pickup-org/mumble-client'

publicHoistPattern:
