overrides:
  fast-uri: '4.2.3'
  protobufjs: '8.8.1'

allowBuilds:
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@tf2pickup-org/mumble-client'

publicHoistPattern:
  - 'playwright*'
  - 'bson'
  - 'framer-motion*'
  - '@discordjs/*'
  - 'discord-api-types'
  - '@fastify/*'
  - '@opentelemetry/*'
