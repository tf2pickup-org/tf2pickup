overrides:
  axios: '1.21.0'
  fast-uri: '4.2.3'
  follow-redirects: '1.16.2'
  lodash: '4.18.1'
  'minimatch@9': '11.0.2'
  'brace-expansion@2': '5.0.12'
  'brace-expansion@5': '5.0.12'
  protobufjs: '8.8.1'
  '@protobufjs/utf8': '1.1.2'
  qs: '6.17.0'

allowBuilds:
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - tsx@4.22.2
  - '@tf2pickup-org/mumble-client'

publicHoistPattern:
  - 'playwright*'
  - 'bson'
  - 'framer-motion*'
  - '@tf2pickup-org/*'
  - '@discordjs/*'
  - 'discord-api-types'
  - 'helmet'
  - '@fastify/*'
  - '@opentelemetry/*'
  - 'thread-stream'
  - 'sonic-boom'
  - 'pino-std-serializers'
